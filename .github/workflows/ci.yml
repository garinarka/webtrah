name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [master]

jobs:
  # BACKEND: migration + 75 test
  backend-tests:
    runs-on: ubuntu-latest

    # Postgres sementara, khusus buat run ini — dibuat & dihapus otomatis,
    # SAMA SEKALI TIDAK menyentuh database lokal/production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: family_user_test
          POSTGRES_PASSWORD: change_me_in_local_only
          POSTGRES_DB: family_tree_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pgsql, pdo_pgsql, mbstring, bcmath, gd, zip, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies (composer)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Siapkan .env dari .env.testing
        run: |
          cp .env.testing .env
          php artisan key:generate

      - name: Jalankan migration
        run: php artisan migrate --force

      - name: Jalankan test suite
        run: php artisan test

  # FRONTEND: build production harus sukses
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm)
        run: npm ci

      - name: Build production
        run: npm run build

  # SECURITY: audit dependency PHP & JS
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies (composer)
        run: composer install --no-interaction --prefer-dist

      - name: composer audit
        run: composer audit

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm)
        run: npm ci

      - name: npm audit
        run: npm audit --omit=dev
