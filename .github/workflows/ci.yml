name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [master]

jobs:
  # BACKEND: migration + 75 test
  backend-tests:
    runs-on: ubuntu-latest

    # Kredensial DB di-set DI SINI, jadi single source of truth untuk CI.
    # Nilai ini otomatis meng-override apapun isi .env.testing (env var
    # asli sistem operasi selalu menang atas isi file .env saat Laravel
    # load Dotenv), jadi CI tidak pernah rusak lagi gara-gara .env.testing
    # lokal berubah.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: family_tree_db_test
      DB_USERNAME: ci_test_user
      DB_PASSWORD: ci_test_password

    # Postgres sementara, khusus buat run ini — dibuat & dihapus otomatis,
    # SAMA SEKALI TIDAK menyentuh database lokal/production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: family_tree_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, mbstring, bcmath, gd, zip, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies (composer)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Beberapa test (mis. yang render halaman Vue penuh, bukan cuma
      # cek JSON/redirect) butuh public/build/manifest.json ada —
      # tanpa ini, @vite directive di app.blade.php error "manifest
      # not found" dan test yang menyentuh halaman manapun gagal.
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm)
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Siapkan .env dari .env.testing
        run: |
          cp .env.testing .env
          php artisan key:generate

      - name: Jalankan migration
        run: php artisan migrate --force

      - name: Jalankan test suite
        run: php artisan test

  # FRONTEND: build production harus sukses
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm)
        run: npm ci

      - name: Build production
        run: npm run build

  # SECURITY: audit dependency PHP & JS
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies (composer)
        run: composer install --no-interaction --prefer-dist

      - name: composer audit
        run: composer audit

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm)
        run: npm ci

      - name: npm audit
        run: npm audit --omit=dev
